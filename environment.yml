name: listing-integrity-agent
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - jupyter
  - notebook
  - ipykernel
  - pandas
  - pytorch>=2.1
  - pyvips                        # required by Moondream2, installs libvips
  - pip:
      # Vision pipeline — ported from product-image-description-alignment
      - transformers>=4.37,<5     # Moondream2's remote code (trust_remote_code=True,
                                   # revision 2025-01-09) targets the 4.x API — transformers
                                   # 5.x renamed/removed internals it relies on (e.g.
                                   # all_tied_weights_keys), breaking model loading
      - easyocr>=1.7.1            # OCR for label text extraction
      - accelerate>=0.27          # optimised HuggingFace model loading
      - einops                    # required by Moondream2's remote modeling code
      # LangGraph / LangChain — agent orchestration
      - langgraph
      - langchain-core
      - langchain-ollama          # local Ollama: qwen2.5:14b (reasoning) + nomic-embed-text (embeddings)
      # RAG
      - langchain-chroma
      - chromadb
